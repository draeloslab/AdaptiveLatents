[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "adaptive_latents"
version = "0.0.1"
description = "Methods for real-time prediction of latent neural dynamics"
authors = [{name = "Jonathan Gould", email = "jngould@umich.edu"},
           {name = "Anne Draelos", email = "adraelos@umich.edu"}]
readme = "README.md"
requires-python = ">=3.10,<=3.13"
keywords = ["neuroscience", "prediction", "dynamics"]
dependencies = [
    "jax[cuda12]",
    "jaxopt",
    "numpy",
    "scipy",
    "importlib-resources", # for config file loading
    "pyyaml",
    "frozendict",
    "tqdm",
    "matplotlib",
    "IPython",  # for plotting in notebooks, could remove?
]

[project.optional-dependencies]
more = [
    # mmica
    "python-picard",
    "mmica@git+https://github.com/draeloslab/mmica",
    # VJF
    "torch",
    "vjf@git+https://github.com/draeloslab/vjf.git@allow_deepcopy",
    # dataset loading
    "datahugger",
    "dandi",
    "h5py",
    "pynwb",
    "scikit-image",
    "adjustText",
    "fsspec",
    "requests",
    "aiohttp",
    "pims",
    "av",
    # visualizaion/other
    "seaborn",
    "pandas",
    "jupyter",
    "ipympl",
    "nbval",
    "pyqt6",
    "papermill",
    "tabulate",
]
dev = [
    "adaptive-latents[more]",
    "pytest",
    "pytest-timeout",
    "pytest-xdist",
    "yapf",
    "isort",
    "coverage",
    "ipdb",
    "nbstripout",
]

[tool.pytest.ini_options]
pythonpath = [
  "." # so we can import from the scripts in the tests; you should still install adaptive_latents as a package
]
norecursedirs = ['datasets']
addopts = '--doctest-modules --doctest-continue-on-failure'
doctest_optionflags = "ELLIPSIS NORMALIZE_WHITESPACE"
timeout = 120

[tool.setuptools]
packages = ["adaptive_latents"]

[tool.setuptools.package-data]
adaptive_latents = ["adaptive_latents_config.yaml"]

[tool.yapf]
based_on_style='facebook'
ARITHMETIC_PRECEDENCE_INDICATION=true
SPLIT_BEFORE_NAMED_ASSIGNS=true
SPACE_BETWEEN_ENDING_COMMA_AND_CLOSING_BRACKET=false
COALESCE_BRACKETS=true
COLUMN_LIMIT=300

[tool.yapfignore]
ignore_patterns=[
    "workspace/datasets/*"
]

[tool.isort]
line_length = 300
skip_glob = ['workspace/datasets/*', '*/.*']

[tool.coverage.report]
exclude_also = [
    # Don't complain if non-runnable code isn't run:
    "if 0:",
    "if __name__ == .__main__.:",
    "if .TYPE_CHECKING.:",

    # Don't complain about abstract methods, they aren't run:
    "@(abc\\.)?abstractmethod",
    ]

[tool.coverage.run]
source = [
    "adaptive_latents",
    "tests",
    "workspace",
    ]
omit = [
    "workspace/datasets/*",
    "*/al_generated/*"
]

[tool.coverage.html]
directory = "./tests/reports/coverage-html"

[tool.coverage.xml]
output = "./tests/reports/coverage.xml"
